[project]
name = "loan-eligibility-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "SQLAlchemy>=2.0,<2.1",
]

[dependency-groups]
dev = ["mypy>=1.18,<2", "pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["services/common", "tests/integration"]
ignore_missing_imports = false
