services:
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      N8N_DB_NAME: ${N8N_DB_NAME:?Set N8N_DB_NAME in .env}
      N8N_DB_USER: ${N8N_DB_USER:?Set N8N_DB_USER in .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:?Set POSTGRES_PORT in .env}
        host_ip: 127.0.0.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - local

  n8n:
    image: n8nio/n8n:2.43.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:?Set N8N_DB_NAME in .env}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:?Set N8N_DB_USER in .env}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:?Set N8N_HOST in .env}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:?Set N8N_PROTOCOL in .env}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:?Set N8N_WEBHOOK_URL in .env}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:?Set GENERIC_TIMEZONE in .env}
      TZ: ${GENERIC_TIMEZONE:?Set GENERIC_TIMEZONE in .env}
    ports:
      - target: 5678
        published: ${N8N_PORT:?Set N8N_PORT in .env}
        host_ip: 127.0.0.1
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - local

  localstack:
    image: localstack/localstack:4.11.0
    restart: unless-stopped
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    ports:
      - target: 4566
        published: ${LOCALSTACK_PORT:?Set LOCALSTACK_PORT in .env}
        host_ip: 127.0.0.1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - local

  discovery:
    build:
      context: .
      dockerfile: infrastructure/discovery/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      MATCHING_WEBHOOK_SECRET: ${MATCHING_WEBHOOK_SECRET:?Run python3 scripts/local_env.py extend-m5}
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-test}
      NOTIFICATION_TRANSPORT: ${NOTIFICATION_TRANSPORT:-mock}
      NOTIFICATION_SES_ENABLED: ${NOTIFICATION_SES_ENABLED:-0}
      NOTIFICATION_TEST_EMAIL: ${NOTIFICATION_TEST_EMAIL:-local-test@example.invalid}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-verified-sender@example.invalid}
    read_only: true
    volumes:
      - ./apps:/app/apps:ro
      - ./services:/app/services:ro
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - local

volumes:
  postgres_data:
  n8n_data:
  localstack_data:

networks:
  local:
    driver: bridge
